spring.application.name=swarmhq

# Database (matches docker-compose.yml / .env at the repo root)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:swarmhq}
spring.datasource.username=${POSTGRES_USER:swarmhq}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

# Flyway (src/main/resources/db/migration) owns the schema; Hibernate only
# validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# MQTT broker (matches docker-compose.yml / .env at the repo root).
# TLS + auth since Sprint 11 - ca-cert-path defaults to the host-relative
# location for local (non-Docker) runs from backend/; the Docker container
# overrides it to the mounted /mosquitto/certs/ca.crt (see docker-compose.yml).
swarmhq.mqtt.broker-url=ssl://${MQTT_HOST:localhost}:${MQTT_PORT:8883}
swarmhq.mqtt.client-id=swarmhq-backend
swarmhq.mqtt.username=swarmhq-backend
swarmhq.mqtt.password=${MQTT_BACKEND_PASSWORD:changeme}
swarmhq.mqtt.ca-cert-path=${MQTT_CA_CERT_PATH:../infra/mosquitto/certs/ca.crt}

# Sprint 14: "centralized" (default, Sprint 10's greedy engine) or
# "auction" (drones bid on missions/available, see AuctionCoordinatorService).
# Sprint 16 made this the *initial* value MissionAssignmentModeHolder starts
# from only - GET/PUT /api/mode (or the frontend toggle) switches it live
# from here on, no restart needed.
swarmhq.mission-assignment.mode=centralized
swarmhq.mission-assignment.auction-window-seconds=3

management.endpoints.web.exposure.include=health,info

# Sprint 16: MissionAssignmentService, AuctionCoordinatorService, and
# SignalMonitorService each have their own @Scheduled task, and
# AuctionCoordinatorService's is unconditionally active now (it used to
# not exist as a bean at all outside auction mode) - Spring Boot's default
# scheduler pool size of 1 means these serialize behind each other on one
# thread. Harmless locally, but on a slower/more contended CI runner this
# showed up as a real delay: AuctionCoordinatorService's 1s tick got
# pushed back far enough to blow through MissionBidListenerTests' own
# Awaitility timeout waiting for a real auction to open and close.
spring.task.scheduling.pool.size=3
