services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: swarmhq-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swarmhq}
      POSTGRES_USER: ${POSTGRES_USER:-swarmhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarmhq} -d ${POSTGRES_DB:-swarmhq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: swarmhq-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swarmhq-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # Container-to-container hostnames/ports on the compose network -
      # not the host-mapped ports from .env (5433/1883 etc.), which only
      # matter for connections from outside this network.
      DB_HOST: postgis
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-swarmhq}
      POSTGRES_USER: ${POSTGRES_USER:-swarmhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8080:8080"

volumes:
  postgres-data:
