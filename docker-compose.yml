services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: swarmhq-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swarmhq}
      POSTGRES_USER: ${POSTGRES_USER:-swarmhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarmhq} -d ${POSTGRES_DB:-swarmhq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: generates the self-signed CA/server cert and the MQTT
  # password file before mosquitto starts (Sprint 11) - see
  # infra/mosquitto/setup/generate.sh. Idempotent, so re-running
  # `docker compose up` never rotates existing secrets.
  mosquitto-setup:
    image: eclipse-mosquitto:2
    container_name: swarmhq-mosquitto-setup
    entrypoint: ["/bin/sh", "/setup/generate.sh"]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?set MQTT_BACKEND_PASSWORD in .env}
      MQTT_DRONE_PASSWORD: ${MQTT_DRONE_PASSWORD:?set MQTT_DRONE_PASSWORD in .env}
    volumes:
      - ./infra/mosquitto/certs:/mosquitto/certs
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/setup:/setup:ro

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: swarmhq-mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-setup:
        condition: service_completed_successfully
    ports:
      - "${MQTT_PORT:-8883}:8883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/certs:/mosquitto/certs
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

  # Identity provider (OIDC/OAuth2) - realm/roles/client/demo users are
  # auto-imported from infra/keycloak/import on first boot (--import-realm),
  # same "provisioned via a committed file, not clicked together" spirit as
  # mosquitto-setup. start-dev is a local-only mode (no TLS, relaxed
  # hostname checks) - fine for this project's scope, not how you'd run
  # Keycloak itself in production.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: swarmhq-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swarmhq-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      # Container-to-container hostnames/ports on the compose network -
      # not the host-mapped ports from .env (5433/8883 etc.), which only
      # matter for connections from outside this network.
      DB_HOST: postgis
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-swarmhq}
      POSTGRES_USER: ${POSTGRES_USER:-swarmhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?set MQTT_BACKEND_PASSWORD in .env}
      MQTT_CA_CERT_PATH: /mosquitto/certs/ca.crt
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_INTERNAL_PORT: 8080
      # Sprint 14: "centralized" (default) or "auction" - just the
      # *initial* value since Sprint 16, switch it live afterward via the
      # frontend toggle or PUT /api/mode instead (see HELP.md), set via
      # MISSION_ASSIGNMENT_MODE in .env, not by editing this file.
      SWARMHQ_MISSION_ASSIGNMENT_MODE: ${MISSION_ASSIGNMENT_MODE:-centralized}
    volumes:
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
    ports:
      - "8080:8080"

volumes:
  postgres-data:
