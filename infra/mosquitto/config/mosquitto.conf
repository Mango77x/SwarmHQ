# SwarmHQ - Mosquitto broker configuration
#
# TLS + per-client authentication (Sprint 11), replacing the anonymous
# plaintext channel from earlier sprints. Certs and the password file are
# generated by the mosquitto-setup service (infra/mosquitto/setup/generate.sh)
# before this container starts - see docker-compose.yml.

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

listener 9001
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
