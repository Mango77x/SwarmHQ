# SwarmHQ - Mosquitto broker configuration (development)
#
# Anonymous access is intentional for this early sprint only: the goal right
# now is to get telemetry flowing end to end. Per-client authentication and
# TLS are a planned differentiation layer (see README "Roadmap") and will
# replace this file before the project is considered feature-complete.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
