# SwarmHQ - per-client topic authorization.
#
# `pattern` entries apply to every authenticated client, substituting %u
# for their own username at connect time - so a client authenticated as
# "drone-3" only ever gets grants for drones/drone-3/*, never another
# drone's topics. This is what makes "per-drone authentication" mean
# something: a compromised drone credential can't impersonate or snoop on
# any other unit, only itself.

user swarmhq-backend
topic read drones/+/telemetry
topic read drones/+/mission-status
topic write drones/+/mission
topic write drones/+/mission/cancel
# Auction mode: the backend broadcasts available missions and collects
# every drone's bid on them.
topic write missions/available
topic read missions/+/bids
# The live centralized/auction toggle, retained so a simulator connecting
# after the fact still learns the current mode immediately.
topic write system/mission-assignment-mode

pattern write drones/%u/telemetry
pattern write drones/%u/mission-status
pattern read drones/%u/mission
pattern read drones/%u/mission/cancel
# Every drone (not just a specific one, hence no %u in the topic itself)
# can hear what's up for bidding and publish its own bid - the bid payload
# carries the bidder's identity, the topic doesn't need to.
pattern read missions/available
pattern write missions/+/bids
# Every drone needs to hear when the mode changes, not just the one that
# happens to trigger it (nothing triggers it from the simulator side at
# all - this is backend-to-simulator only).
pattern read system/mission-assignment-mode
