# SwarmHQ - per-client topic authorization (Sprint 11).
#
# `pattern` entries apply to every authenticated client, substituting %u
# for their own username at connect time - so a client authenticated as
# "drone-3" only ever gets grants for drones/drone-3/*, never another
# drone's topics. This is what makes "per-drone authentication" mean
# something: a compromised drone credential can't impersonate or snoop on
# any other unit, only itself.

user swarmhq-backend
topic read drones/+/telemetry
topic read drones/+/mission-status
topic write drones/+/mission

pattern write drones/%u/telemetry
pattern write drones/%u/mission-status
pattern read drones/%u/mission
